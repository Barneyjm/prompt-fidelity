[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptfidelity"
version = "0.1.0"
description = "Mechanical intent-ledger accounting for how much of a prompt's intent an agent actually executes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prompt-fidelity" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
langchain = ["langchain-core>=0.2"]
mcp = ["mcp>=1.19", "fastmcp>=2.9"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Barneyjm/prompt-fidelity"

[tool.hatch.build.targets.wheel]
packages = ["src/promptfidelity"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
